<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Turn reminder test</title>
<style>
  :root { color-scheme: dark; --bg:#111; --panel:#1c1c1e; --line:#333; --fg:#f2f2f2; --dim:#9a9a9a; --accent:#ffd60a; }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body { margin:0; background:var(--bg); color:var(--fg); font:16px/1.4 system-ui, sans-serif; padding:0 16px 24px; }
  #view { width:100%; min-height:200px; background:#000; display:block; margin:0 auto; max-height:56vh; object-fit:contain; }
  #video { position:fixed; width:1px; height:1px; opacity:0; pointer-events:none; }
  #banner { font-size:1.45rem; font-weight:800; color:#000; background:var(--accent); border-radius:10px; padding:10px 12px; margin:10px 0 0; }
  #text { font-size:1.05rem; font-weight:600; margin:10px 0 2px; min-height:1.5em; color:var(--accent); }
  #meta { color:var(--dim); font-size:.85rem; min-height:1.2em; }
  .row { display:flex; gap:8px; margin:10px 0; align-items:center; flex-wrap:wrap; }
  button { background:var(--panel); color:var(--fg); border:1px solid var(--line); border-radius:10px; padding:12px 14px; font:inherit; min-height:44px; flex:1; }
  button.on { background:var(--accent); color:#000; border-color:var(--accent); font-weight:700; }
  #go { width:100%; flex:none; margin-top:12px; font-weight:700; }
  label { display:flex; flex-direction:column; gap:4px; flex:1; font-size:.8rem; color:var(--dim); min-width:90px; }
  input[type=number], select { background:var(--panel); color:var(--fg); border:1px solid var(--line); border-radius:8px; padding:10px; font:inherit; width:100%; }
  #dist { min-width:120px; text-align:center; flex:1; font-weight:700; }
  .check { flex-direction:row; align-items:center; gap:8px; color:var(--fg); font-size:1rem; }
  .check input { width:20px; height:20px; }
  #err { color:#ff453a; min-height:1.2em; font-size:.9rem; }
</style>
</head>
<body>
<h3 style="margin:14px 0 8px">轉彎提醒測試</h3>
<img id="view" alt="analysis result">
<video id="video" playsinline muted></video>
<canvas id="canvas" hidden></canvas>

<div id="banner" hidden></div>
<div id="text">按「開始」啟動相機</div>
<div id="meta"></div>
<div id="err"></div>

<div class="row" role="group" aria-label="turn instruction">
  <button data-turn="LEFT">左轉</button>
  <button data-turn="STRAIGHT">直走</button>
  <button data-turn="RIGHT">右轉</button>
</div>

<div class="row">
  <label>距離來源
    <select id="dsrc">
      <option value="manual">手動（用 −／＋ 調）</option>
      <option value="sim">模擬走路（自動倒數）</option>
      <option value="gps">手機 GPS（先標記轉彎點）</option>
    </select>
  </label>
</div>
<div class="row" id="stepper">
  <button id="dm" aria-label="distance minus">−1</button>
  <div id="dist">距轉彎 25.0 m</div>
  <button id="dp" aria-label="distance plus">+1</button>
</div>
<div class="row" id="gpsrow" hidden>
  <button id="mark">標記轉彎點（我現在站在轉彎處）</button>
</div>
<div class="row"><button id="reset">重新提醒（距離回到 25 m）</button></div>

<div class="row">
  <label>鏡頭高度 (m)<input id="height" type="number" step="0.05" min="0.5" max="2.2" value="1.3"></label>
  <label>水平視角 (°)<input id="hfov" type="number" step="1" min="30" max="120" value="55"></label>
</div>
<div class="row">
  <label>傾斜角來源
    <select id="pmode"><option value="auto">手機感應器</option><option value="manual">手動</option></select>
  </label>
  <label>手動傾斜 (°)<input id="pmanual" type="number" step="1" min="-20" max="70" value="10"></label>
</div>
<div class="row"><label class="check"><input id="speak" type="checkbox" checked>念出提醒</label></div>

<button id="go">開始</button>
<p style="color:var(--dim);font-size:.85rem">
  先選「模擬走路」，按開始後距離會自動倒數，就能聽到 20、10、5、3 公尺和「現在轉彎」的提醒。
  GPS 模式要在戶外，站在轉彎處按「標記轉彎點」，走開約 25 公尺再走回來；手機 GPS 通常有幾公尺誤差。
  請直式手持或掛在胸前，鏡頭朝前。
</p>

<script>
const $ = id => document.getElementById(id);
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
};
const state = { turn: store.get('turn', 'LEFT'), dist: 25.0, running: false, beta: null,
                gps: null, turnPt: null, watch: null, resetNext: true };
const sleep = ms => new Promise(r => setTimeout(r, ms));
let stream = null, wakeLock = null, bannerUntil = 0;

for (const id of ['height', 'hfov', 'pmanual']) { $(id).value = store.get(id, $(id).value); $(id).addEventListener('change', () => store.set(id, $(id).value)); }
$('pmode').value = store.get('pmode', 'auto'); $('pmode').addEventListener('change', () => store.set('pmode', $('pmode').value));
$('speak').checked = store.get('speak', true); $('speak').addEventListener('change', () => store.set('speak', $('speak').checked));

function haversine(a, b) {
  const R = 6371000, rad = Math.PI / 180;
  const dLat = (b.lat - a.lat) * rad, dLon = (b.lon - a.lon) * rad;
  const x = Math.sin(dLat / 2) ** 2 + Math.cos(a.lat * rad) * Math.cos(b.lat * rad) * Math.sin(dLon / 2) ** 2;
  return 2 * R * Math.asin(Math.sqrt(x));
}
// Distance sent to the server. null = GPS mode but no turn point / position yet.
function currentDist() {
  if ($('dsrc').value === 'gps') return (state.turnPt && state.gps) ? haversine(state.gps, state.turnPt) : null;
  return state.dist;
}
function paint() {
  document.querySelectorAll('[data-turn]').forEach(b => b.classList.toggle('on', b.dataset.turn === state.turn));
  const gpsMode = $('dsrc').value === 'gps', d = currentDist();
  $('gpsrow').hidden = !gpsMode;
  $('stepper').hidden = gpsMode;
  $('dist').textContent = d === null ? '距轉彎 --' : '距轉彎 ' + d.toFixed(1) + ' m';
}
document.querySelectorAll('[data-turn]').forEach(b => b.addEventListener('click', () => { state.turn = b.dataset.turn; store.set('turn', state.turn); state.resetNext = true; paint(); }));
$('dm').addEventListener('click', () => { state.dist = Math.max(0, state.dist - 1); paint(); });
$('dp').addEventListener('click', () => { state.dist = Math.min(60, state.dist + 1); paint(); });
$('reset').addEventListener('click', () => { state.dist = 25.0; state.resetNext = true; paint(); });

function startGps() {
  if (state.watch !== null || !navigator.geolocation) return;
  state.watch = navigator.geolocation.watchPosition(
    p => { state.gps = { lat: p.coords.latitude, lon: p.coords.longitude, acc: p.coords.accuracy }; paint(); },
    e => { $('err').textContent = 'GPS：' + e.message; },
    { enableHighAccuracy: true, maximumAge: 0, timeout: 20000 });
}
function stopGps() { if (state.watch !== null) { navigator.geolocation.clearWatch(state.watch); state.watch = null; } }
$('dsrc').addEventListener('change', () => {
  if ($('dsrc').value === 'gps') startGps(); else stopGps();
  state.resetNext = true; paint();
});
$('mark').addEventListener('click', () => {
  if (!state.gps) { $('err').textContent = '還沒有 GPS 位置，請稍等，或到戶外再試'; return; }
  state.turnPt = { lat: state.gps.lat, lon: state.gps.lon };
  state.resetNext = true; $('err').textContent = ''; paint();
});
// simulated walking: about 1.2 m per second
setInterval(() => {
  if (state.running && $('dsrc').value === 'sim') { state.dist = Math.max(0, state.dist - 0.3); paint(); }
}, 250);

// Portrait phone: beta is ~90 when the camera points at the horizon, smaller when tilted down.
function pitchNow() {
  if ($('pmode').value === 'auto' && state.beta !== null) return Math.max(-20, Math.min(70, 90 - state.beta));
  return parseFloat($('pmanual').value) || 10;
}
function onOrient(e) { if (e.beta !== null && e.beta !== undefined) state.beta = e.beta; }

function speak(msg) {
  if (!$('speak').checked || !('speechSynthesis' in window)) return;
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(msg); u.lang = 'en-US';
  speechSynthesis.speak(u);
}
function showBanner(msg) {
  $('banner').textContent = msg; $('banner').hidden = false; bannerUntil = Date.now() + 6000;
  speak(msg);
}

async function loop() {
  const video = $('video'), canvas = $('canvas'), ctx = canvas.getContext('2d');
  while (state.running) {
    const t0 = performance.now();
    if (Date.now() > bannerUntil) $('banner').hidden = true;
    const vw = video.videoWidth, vh = video.videoHeight;
    if (!vw) { await sleep(50); continue; }
    const s = 640 / Math.max(vw, vh);
    canvas.width = Math.round(vw * s); canvas.height = Math.round(vh * s);
    ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
    const blob = await new Promise(r => canvas.toBlob(r, 'image/jpeg', 0.7));
    const d = currentDist();                         // null: no GPS fix yet -> far away, no reminders
    const q = new URLSearchParams({
      turn: state.turn, dist: d === null ? 60 : d, pitch: pitchNow(),
      height: $('height').value || 1.3, hfov: $('hfov').value || 55
    });
    if (state.resetNext) { q.set('reset', '1'); state.resetNext = false; }
    try {
      const res = await fetch('/analyze?' + q, { method: 'POST', headers: { 'Content-Type': 'image/jpeg' }, body: blob });
      const j = await res.json();
      if (!res.ok) throw new Error(j.error || res.status);
      $('view').src = j.image;
      $('text').textContent = j.text;
      const acc = ($('dsrc').value === 'gps' && state.gps) ? ` · GPS ±${Math.round(state.gps.acc)} m` : '';
      $('meta').textContent = `傾斜 ${pitchNow().toFixed(0)}° · 伺服器 ${j.ms} ms · 來回 ${Math.round(performance.now() - t0)} ms${acc}`;
      $('err').textContent = '';
      if (j.reminder) showBanner(j.reminder);
    } catch (e) {
      $('err').textContent = '連線錯誤：' + e.message;
      await sleep(500);
    }
  }
}

async function start() {
  $('err').textContent = '';
  try {
    // iOS needs this to be asked inside the tap handler, before other awaits.
    if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
      try { await DeviceOrientationEvent.requestPermission(); } catch (e) {}
    }
    window.addEventListener('deviceorientation', onOrient);
    if ($('dsrc').value === 'gps') startGps();
    stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: { ideal: 'environment' }, width: { ideal: 1280 }, height: { ideal: 720 } }, audio: false
    });
    const video = $('video'); video.srcObject = stream; await video.play();
    try { if (navigator.wakeLock) wakeLock = await navigator.wakeLock.request('screen'); } catch (e) {}
    state.resetNext = true; state.running = true; $('go').textContent = '停止'; loop();
  } catch (e) {
    $('err').textContent = '無法開啟相機：' + e.message + '（需要 https，且要允許相機權限）';
  }
}
function stop() {
  state.running = false; $('go').textContent = '開始';
  if (stream) stream.getTracks().forEach(t => t.stop());
  window.removeEventListener('deviceorientation', onOrient);
  stopGps();
  try { if (wakeLock) wakeLock.release(); } catch (e) {}
  if ('speechSynthesis' in window) speechSynthesis.cancel();
}
$('go').addEventListener('click', () => state.running ? stop() : start());
paint();
</script>
</body>
</html>
